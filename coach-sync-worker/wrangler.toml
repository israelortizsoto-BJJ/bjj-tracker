name = "matmind-coach-sync"
main = "src/index.ts"
compatibility_date = "2024-12-01"

[vars]
# Upload Foundation remains completely inert until explicitly enabled per environment.
SHARED_MATCH_MEDIA_UPLOAD_ENABLED = "0"
# Production Verification remains completely inert until explicitly enabled per environment.
SHARED_MATCH_MEDIA_VERIFICATION_ENABLED = "0"
# Canary identity defaults empty (fail-closed bypass). Never commit real canary identities.
SHARED_MATCH_MEDIA_VERIFICATION_CANARY_ASSET_ID = ""
SHARED_MATCH_MEDIA_VERIFICATION_CANARY_OBJECT_VERSION = ""
# Publication remains completely inert until explicitly enabled per environment.
# Independent of Upload and Verification flags — neither may open Publication.
SHARED_MATCH_MEDIA_PUBLICATION_ENABLED = "0"
# Read-only session GET projection remains absent unless explicitly enabled.
SHARED_MATCH_MEDIA_ATTACHMENT_PROJECTION_ENABLED = "0"
# Coach Match-media resolution remains completely inert until explicitly enabled.
SHARED_MATCH_MEDIA_RESOLUTION_ENABLED = "0"
# Coach Match Breakdown schema-v2 publication remains blocked until explicitly enabled.
# Independent of SHARED_MATCH_MEDIA_* flags — none may open schema-v2 publication.
COACH_MATCH_BREAKDOWN_SCHEMA_V2_PUBLICATION_ENABLED = "0"
# SHARED_MATCH_MEDIA_VERIFICATION_OPERATOR_SECRET is a Cloudflare secret binding only —
# never place it in [vars] or commit it.

# Create a KV namespace: `npx wrangler kv namespace create SESSIONS`
# then paste its id below.
[[kv_namespaces]]
binding = "SESSIONS"
id = "f0bdf0b98ab5482e83238874cd7bb160"

# Create an R2 bucket: `npx wrangler r2 bucket create matmind-coach-media`
# Object store for coach commentary audio (bytes only; never in KV artifacts).
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "matmind-coach-media"
