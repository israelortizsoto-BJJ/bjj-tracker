name = "matmind-coach-sync"
main = "src/index.ts"
compatibility_date = "2024-12-01"

[vars]
# Upload Foundation remains completely inert until explicitly enabled per environment.
SHARED_MATCH_MEDIA_UPLOAD_ENABLED = "0"

# Create a KV namespace: `npx wrangler kv namespace create SESSIONS`
# then paste its id below.
[[kv_namespaces]]
binding = "SESSIONS"
id = "f0bdf0b98ab5482e83238874cd7bb160"

# Create an R2 bucket: `npx wrangler r2 bucket create matmind-coach-media`
# Object store for coach commentary audio (bytes only; never in KV artifacts).
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "matmind-coach-media"
